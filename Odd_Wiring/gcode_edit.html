<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Keep existing head and tailwind script -->
</head>
<body class="bg-slate-900 text-on-surface antialiased flex items-center justify-center min-h-screen p-0 sm:p-4">

  <!-- TARGET BOUNDARY START: Phone Frame Container -->
  <div class="relative w-[390px] h-[884px] bg-surface rounded-[48px] shadow-2xl overflow-hidden border-[8px] border-slate-800 flex flex-col shrink-0 select-none">
    
    <!-- 1. Integrated Header & Status Bar (Shrink-0) -->
    <header class="w-full shrink-0 pt-3 pb-2 px-margin bg-surface/90 backdrop-blur-xl border-b border-border-subtle/50 z-30 flex flex-col gap-1">
      <!-- Status Row -->
      <div class="flex items-center justify-between h-5 text-on-surface">
        <span class="text-[12px] font-semibold tracking-tight">9:41</span>
        <div class="w-20 h-3.5 bg-slate-950 rounded-full"></div>
        <div class="flex items-center gap-1 text-[12px]">
          <span class="material-symbols-outlined text-[13px]">signal_cellular_4_bar</span>
          <span class="material-symbols-outlined text-[13px]">wifi</span>
          <span class="material-symbols-outlined text-[13px]">battery_full</span>
        </div>
      </div>
      <!-- App Title Row -->
      <div class="flex items-center justify-between h-9">
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-secondary text-[18px]">neurology</span>
            <span class="font-bold uppercase tracking-tight text-text-primary text-[15px] leading-none">ODD WIRING</span>
          </div>
          <span class="text-[11px] text-text-muted leading-tight mt-0.5">Psychology Facts</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-8 h-8 flex items-center justify-center text-on-surface">
            <span class="material-symbols-outlined text-[18px]">search</span>
          </button>
          <div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-on-primary text-[16px]">person</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. Main Content Stream (Flex-1 Overflow Hidden) -->
    <main class="flex-1 w-full p-margin flex flex-col justify-between overflow-hidden bg-surface">
      
      <!-- Subtitle Row -->
      <div class="flex items-center justify-between pb-1 shrink-0">
        <div class="flex flex-col min-w-0 pr-space-xs">
          <span class="font-bold uppercase text-text-primary text-[14px] tracking-tight truncate leading-tight">
            Things Your Brain Does Without Asking
          </span>
          <span class="text-label-sm text-text-muted truncate mt-0.5">
            8 Automatic Cognitive Reflexes
          </span>
        </div>
        <div class="flex items-center gap-1 bg-secondary/10 px-2 py-0.5 rounded-full shrink-0 border border-secondary/20">
          <span class="material-symbols-outlined text-[12px] text-secondary" style="font-variation-settings: 'FILL' 1;">bolt</span>
          <span class="text-[10px] text-secondary font-bold tracking-wider">LIVE</span>
        </div>
      </div>

      <!-- 8 Scannable Rows -->
      <div class="flex flex-col flex-1 justify-between gap-1.5 my-1 overflow-hidden" id="facts-stream">
        <!-- Fact Items 01 - 08 -->
      </div>

      <!-- Footer Micro-Interaction Bar -->
      <div class="flex items-center justify-between pt-1 shrink-0 border-t border-border-subtle/50">
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
          <span class="text-[11px] text-text-muted">Tap any item to acknowledge</span>
        </div>
        <span class="text-[11px] text-text-primary font-bold" id="read-count">0 / 8 Seen</span>
      </div>
    </main>

    <!-- 3. Bottom Navigation Bar (Shrink-0) -->
    <nav class="w-full shrink-0 pb-2 bg-surface/90 backdrop-blur-xl border-t border-border-subtle/60 z-30 flex flex-col items-center">
      <div class="h-12 w-full flex items-center justify-around px-gutter">
        <a class="flex flex-col items-center justify-center text-secondary font-semibold" href="#">
          <span class="material-symbols-outlined text-[20px]">electric_bolt</span>
          <span class="text-[10px] mt-0.5">Facts</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#">
          <span class="material-symbols-outlined text-[20px]">forum</span>
          <span class="text-[10px] mt-0.5">Dilemmas</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#">
          <span class="material-symbols-outlined text-[20px]">travel_explore</span>
          <span class="text-[10px] mt-0.5">Explore</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant" href="#">
          <span class="material-symbols-outlined text-[20px]">bookmarks</span>
          <span class="text-[10px] mt-0.5">Archive</span>
        </a>
      </div>
      <!-- Home Indicator -->
      <div class="w-28 h-1 bg-slate-300 rounded-full mt-1"></div>
    </nav>

  </div>
  <!-- TARGET BOUNDARY END -->
